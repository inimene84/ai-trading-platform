# ---------------------------------------------------------------------------
# QuantumTrade Pro — Python project metadata (PEP 621)
#
# Dependency policy:
#   * This file is the single source of truth for the declared dependency set.
#   * backend/requirements.txt is the *deployment* manifest: production
#     (Dockerfile.backend) and CI install from it, so "CI green" == "production
#     behavior". It must stay a mirror of [project.dependencies] below.
#   * When bumping a dependency, update BOTH files and re-run
#     `pytest backend/tests`.
# ---------------------------------------------------------------------------
[project]
name = "quantumtrade-pro"
version = "1.1.0"
description = "QuantumTrade Pro — AI-powered multi-agent hedge fund / crypto-futures trading platform"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "Toomas Valk", email = "inimene84@users.noreply.github.com" },
]
keywords = ["trading", "crypto", "futures", "binance", "langgraph", "agents", "fastapi"]
classifiers = [
    # Private project — this guard makes an accidental `twine upload` fail.
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # --- Web framework ---
    "fastapi[standard]>=0.104.0",
    "fastapi-cli>=0.0.8",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.14.1",
    "starlette>=1.3.1",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    # --- Data layer ---
    "SQLAlchemy>=2.0.22",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "influxdb-client>=1.50.0",
    "qdrant-client>=1.9.0",
    # --- HTTP / networking ---
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "aiohttp>=3.14.3",
    "websockets>=12.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "cryptography>=50.0.1",
    # --- Brokers / market data ---
    "python-binance>=1.0.19",
    "ccxt>=4.2.0",
    "yfinance>=0.2.25",
    "feedparser>=6.0.0",
    # --- LLM / agents ---
    "langchain>=0.3.30",
    "langchain-core>=1.2.22",
    "langchain-text-splitters>=1.1.2",
    "langchain-anthropic>=0.3.5",
    "langchain-openai>=1.1.14",
    "langchain-groq>=0.2.3",
    "langchain-deepseek>=0.1.2",
    "langchain-ollama>=0.3.6",
    "langchain-google-genai>=2.0.11",
    "langchain-xai>=0.2.5",
    "langchain-gigachat>=0.3.12",
    "langgraph>=1.2.11,<1.3.0",
    "langgraph-checkpoint>=4.1.0,<5.0.0",
    "langsmith>=0.8.0",
    # --- Science / reporting ---
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "matplotlib>=3.9.0",
    "tabulate>=0.9.0",
    # Imported directly by backend/backtesting/engine.py & backend/cli/input.py
    # (previously only present transitively via pandas).
    "python-dateutil>=2.8.2",
    # --- Config / serialization ---
    "python-dotenv>=1.2.2",
    # Imported directly by backend/services/{persona_adapter,opinion_layer}.py.
    "PyYAML>=6.0",
    # Imported directly by several backend/agents/* modules.
    "typing-extensions>=4.8.0",
    # --- CLI / UX / ops ---
    "colorama>=0.4.6",
    "questionary>=2.1.0",
    "rich>=13.9.0",
    "structlog>=24.1.0",
    "croniter>=2.0.0",
    # --- cTrader transport (ctrader-open-api itself is installed --no-deps in
    # Dockerfile.backend because it pins protobuf 3.20; these are its runtime
    # requirements, declared here so the deploy manifest stays mirrored) ---
    "protobuf>=4.25.0",
    "Twisted>=24.3.0",
    "pyopenssl>=24.0.0",
    "service-identity>=24.1.0",
    # --- Auth / security ---
    "pyjwt>=2.12.1",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
    # --- Observability ---
    "sentry-sdk[fastapi]>=2.0.0",
    # --- Templating / misc (transitive pin required by alembic) ---
    "Mako>=1.3.12",
]

[project.optional-dependencies]
# Test/lint tooling. CI and the production image currently install pytest,
# pytest-asyncio and black from backend/requirements.txt; keeping them declared
# here too means `pip install -e ".[dev]"` gives a complete local setup.
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.5",
    "black>=26.3.1",
    "ruff>=0.6.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]
# Optional brokers / models: imported lazily inside try/except and only needed
# when the corresponding broker is enabled (see backend/brokers/registry.py and
# backend/services/ctrader_service.py). Not installed by default.
brokers-alpaca = ["alpaca-py>=0.20.0"]
brokers-ctrader = ["ctrader-open-api>=0.9.2", "twisted>=23.10.0"]

[project.scripts]
backtester = "backend.backtesting.cli:main"

[project.urls]
Homepage = "https://github.com/inimene84/ai-trading-platform."
Repository = "https://github.com/inimene84/ai-trading-platform..git"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Package only the backend application. Tests, the React frontend, ops scripts
# and scratch files must never end up in a built wheel/sdist.
packages = [
    { include = "backend" },
]
exclude = [
    "backend/tests",
    "backend/**/__pycache__",
    "backend/**/*.db",
    "backend/alembic/versions/__pycache__",
]

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[tool.ruff]
line-length = 420
target-version = "py311"
extend-exclude = [
    "backend/alembic/versions",
    "scripts",
    "scratch",
]
src = ["backend"]

[tool.ruff.lint]
# Start permissive: surface only high-confidence issues. Tighten over time.
select = [
    "E9",   # syntax errors / runtime-undefined names (hard errors)
    "F401", # unused imports
    "F811", # redefined name
    "F821", # undefined name
    "F841", # unused variable
    "W6",   # deprecated
]
ignore = [
    "E501",  # line too long (black handles formatting; repo uses long lines)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F401", "F841"]
