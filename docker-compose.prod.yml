services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-trading-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      OLLAMA_BASE_URL: http://litellm:4000
      TRADING_MODE: ${TRADING_MODE:-paper}
      PAPER_TRADING: ${PAPER_TRADING:-true}
      ACTIVE_BROKER: ${ACTIVE_BROKER:-binance_futures}
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-false}
      BINANCE_DRY_RUN: ${BINANCE_DRY_RUN:-true}
      DRY_RUN_ALL: ${DRY_RUN_ALL:-true}
      CTRADER_FOREX_ONLY: ${CTRADER_FOREX_ONLY:-true}
      CTRADER_MAX_OPEN_POSITIONS: ${CTRADER_MAX_OPEN_POSITIONS:-10}
      CTRADER_MAX_READY_PER_POLL: ${CTRADER_MAX_READY_PER_POLL:-10}
      CTRADER_MAX_LOTS: ${CTRADER_MAX_LOTS:-0.10}
      CTRADER_ONE_POSITION_PER_SYMBOL: ${CTRADER_ONE_POSITION_PER_SYMBOL:-true}
      CTRADER_INCLUDE_METALS: ${CTRADER_INCLUDE_METALS:-false}
      CTRADER_MAX_SAME_BASE: ${CTRADER_MAX_SAME_BASE:-2}
      CTRADER_MAX_METAL_LOTS: ${CTRADER_MAX_METAL_LOTS:-0.01}
      CTRADER_MAX_CANDIDATES: ${CTRADER_MAX_CANDIDATES:-200}
      CTRADER_FALLBACK_EQUITY: ${CTRADER_FALLBACK_EQUITY:-150}
      CTRADER_AUTO_CONNECT: ${CTRADER_AUTO_CONNECT:-true}
      CTRADER_MIN_STOP_PIPS: ${CTRADER_MIN_STOP_PIPS:-10}
      CTRADER_MIN_JPY_STOP_PIPS: ${CTRADER_MIN_JPY_STOP_PIPS:-30}
      SIGNAL_STOP_TIMEFRAME: ${SIGNAL_STOP_TIMEFRAME:-H1}
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      PERSONA_LLM_PROVIDER: ${PERSONA_LLM_PROVIDER:-omniroute}
      PERSONA_LLM_MODEL: ${PERSONA_LLM_MODEL:-auto/fast}
      OMNIROUTE_DEFAULT_MODEL: ${OMNIROUTE_DEFAULT_MODEL:-auto/fast}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PERSONA_LLM_BASE_URL: ${PERSONA_LLM_BASE_URL:-https://omni.allikas.online/v1}
      KIE_MODEL: ${KIE_MODEL:-gpt-5-6-luna}
      KIE_FALLBACK_MODELS: ${KIE_FALLBACK_MODELS:-gemini-3-8-flash-openai,claude-haiku-4-5}
      KIE_OPUS_MODEL: ${KIE_OPUS_MODEL:-}
      # OmniRoute — primary LLM provider (https://omni.allikas.online)
      # auto/* presets automatically pick best/free model for each task
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-https://omni.allikas.online/v1}
      # Safety: risk guard ENABLED by default. Only disable for explicit testing by setting DISABLE_RISK_GUARD=true in .env
      DISABLE_RISK_GUARD: ${DISABLE_RISK_GUARD:-false}
      # MiCA/EEA: trade USDC-margined perpetuals (USDT restricted for EU users).
      # 9 USDC pairs (DOT has no USDC perp). Override via TRADING_SYMBOLS in .env.
      TRADING_SYMBOLS: ${TRADING_SYMBOLS:-BTCUSDC,ETHUSDC,SOLUSDC,BNBUSDC,XRPUSDC,AVAXUSDC,LINKUSDC,UNIUSDC}
      # Liquidity floor. 3M keeps USDC majors (USDC books are thinner than
      # USDT twins; 50M would silently drop AVAX/LINK/UNI). Override in .env.
      MIN_24H_QUOTE_VOLUME_USDT: ${MIN_24H_QUOTE_VOLUME_USDT:-3000000}
      # Payoff geometry. TRAIL_ATR_MULT MUST be < TRAIL_ACTIVATION_ATR.
      # Activation 2.0 lets winners approach the 2.5R TP before trailing.
      SL_ATR_MULT: ${SL_ATR_MULT:-1.75}
      TP_ATR_MULT: ${TP_ATR_MULT:-5.5}
      ATR_PERIOD: ${ATR_PERIOD:-14}
      TRAIL_ACTIVATION_ATR: ${TRAIL_ACTIVATION_ATR:-2.0}
      TRAIL_ATR_MULT: ${TRAIL_ATR_MULT:-0.8}
      STEP_TRAIL_ENABLED: ${STEP_TRAIL_ENABLED:-false}
      RISK_MAX_DRAWDOWN_PCT: ${RISK_MAX_DRAWDOWN_PCT:-20}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-5}
      RISK_PEAK_LOOKBACK_HOURS: ${RISK_PEAK_LOOKBACK_HOURS:-72}
      MAX_POSITIONS: ${MAX_POSITIONS:-20}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-20}
      BINANCE_MAX_OPEN_POSITIONS: ${BINANCE_MAX_OPEN_POSITIONS:-10}
      PYRAMID_MAX_LAYERS: ${PYRAMID_MAX_LAYERS:-2}
      PYRAMID_BLOCK_UNDERWATER: ${PYRAMID_BLOCK_UNDERWATER:-true}
      MAX_SAME_DIRECTION_POSITIONS: ${MAX_SAME_DIRECTION_POSITIONS:-10}
      EQUITY_RISK_SCOPE: ${EQUITY_RISK_SCOPE:-broker}
      SENTRY_AUTO_RESUME_ENABLED: ${SENTRY_AUTO_RESUME_ENABLED:-true}
      SENTRY_AUTO_RESUME_LIVE_CONFIRM: ${SENTRY_AUTO_RESUME_LIVE_CONFIRM:-}
      # Fee-churn fix: post-only (GTX) maker entries with MARKET fallback.
      # OFF by default (fail-safe). Set true to cut entry fees 0.05%->0.02%.
      MAKER_ENTRY_ENABLED: ${MAKER_ENTRY_ENABLED:-true}
      MAKER_WAIT_SEC: ${MAKER_WAIT_SEC:-30}
      INFLUXDB_URL: http://vps-influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-hedge-fund}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-trading-system}
      # Kronos timing-gate sidecar (runs alongside backend on the same stack)
      KRONOS_SIDECAR_URL: ${KRONOS_SIDECAR_URL:-http://kronos-infer:8001}
      SCRAPLING_RESEARCH_URL: ${SCRAPLING_RESEARCH_URL:-http://ai-trading-scrapling:8080}
      TIMING_GATE_SHADOW: ${TIMING_GATE_SHADOW:-false}
      ENABLE_VISION_TIMING: ${ENABLE_VISION_TIMING:-false}
      KRONOS_ALLOW_LOCAL_STUB: ${KRONOS_ALLOW_LOCAL_STUB:-false}
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 6G
        reservations:
          cpus: 0.5
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    restart: unless-stopped
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ./.env:/app/.env
      # Live tree is the source of truth. Without this mount a recreate
      # ships the baked image and drops host hotfixes (admission control).
      - ./backend:/app/backend
    networks:
      - trading-net
    ports:
      - "127.0.0.1:8001:8000"
  litellm:
    # Pin digest (was main-latest) — matches current VPS image for stable restarts.
    image: ghcr.io/berriai/litellm@sha256:2fdd90b14e3d9244ce297f418b983d8cfd90ba6e72a10a8ddb30f7cf64852390
    container_name: ai-trading-litellm
    environment:
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KIE_API_KEY: ${KIE_API_KEY:-}
      KIE_BEARER_TOKEN: "Bearer ${KIE_API_KEY:-}"
      LITELLM_MODEL_FALLBACK: true
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set}
    command: --config /tmp/litellm-config.yaml --port 4000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - ./litellm-config.yaml:/tmp/litellm-config.yaml:ro
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '0.25'
          memory: 256M
  nginx:
    image: nginx:alpine
    container_name: ai-trading-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: vps-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - ./qdrant-storage:/qdrant/storage
    networks:
      - trading-net
  influxdb:
    image: influxdb:2.8
    container_name: vps-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      # Reuse Hostinger stack volume with historical trading metrics
      - influxdb-2-ksyg_influxdb2-data:/var/lib/influxdb2
      - influxdb-2-ksyg_influxdb2-config:/etc/influxdb2
    networks:
      - trading-net
  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-trading-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      INFLUXDB_ORG: ${INFLUXDB_ORG:-hedge-fund}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - influxdb
    networks:
      - trading-net
  sentry-watchdog:
    build:
      context: .
      dockerfile: sentry_watchdog/Dockerfile
    container_name: ai-trading-sentry-watchdog
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      SENTRY_WATCHDOG_TOKEN: ${SENTRY_WATCHDOG_TOKEN:-}
      SENTRY_STATE_DIR: /app/data/sentry
      SENTRY_AUTO_RESUME_ENABLED: ${SENTRY_AUTO_RESUME_ENABLED:-true}
      SENTRY_AUTO_RESUME_LIVE_CONFIRM: ${SENTRY_AUTO_RESUME_LIVE_CONFIRM:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
      PAPER_TRADING: ${PAPER_TRADING:-true}
      DRY_RUN_ALL: ${DRY_RUN_ALL:-true}
    volumes:
      - app-data:/app/data
    depends_on:
      - backend
    networks:
      - trading-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: ai-trading-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    env_file:
      - .env
    environment:
      - BACKEND_BASE_URL=http://ai-trading-backend:8000
      - BACKEND_API_PREFIX=/api
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9100
      # Compose interpolates ADMIN_API_KEY from project .env; env_file keeps
      # other runtime secrets available inside the container as well.
      - MCP_API_TOKEN=${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      - SCRAPLING_RESEARCH_URL=http://ai-trading-scrapling:8080
    networks:
      - trading-net
    depends_on:
      - backend
  scrapling:
    image: pyd4vinci/scrapling:latest
    container_name: ai-trading-scrapling
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/scrapling-sidecar/entrypoint.sh"]
    ports:
      - "127.0.0.1:8003:8000"
      - "127.0.0.1:8004:8080"
    env_file:
      - .env
    environment:
      SCRAPLING_MCP_AUTH_TOKEN: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      BACKEND_BASE_URL: http://ai-trading-backend:8000
      BACKEND_API_PREFIX: /api
      SCRAPLING_INGEST_ENABLED: ${SCRAPLING_INGEST_ENABLED:-false}
      SCRAPLING_INGEST_INTERVAL_SEC: ${SCRAPLING_INGEST_INTERVAL_SEC:-3600}
      JBLANKED_API_KEY: ${JBLANKED_API_KEY:-}
      CALENDAR_JSON_URL: ${CALENDAR_JSON_URL:-}
      NEWS_RSS_URLS: ${NEWS_RSS_URLS:-https://www.federalreserve.gov/feeds/press_all.xml}
    volumes:
      - ./scrapling_sidecar:/opt/scrapling-sidecar:ro
    networks:
      - trading-net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
  kronos-infer:
    build:
      context: ./kronos-infer
      dockerfile: Dockerfile
    container_name: ai-trading-kronos
    restart: unless-stopped
    # Internal only — backend reaches it via Docker network on :8001
    environment:
      - KRONOS_MODEL=NeoQuasar/Kronos-mini
      - KRONOS_TOKENIZER=NeoQuasar/Kronos-Tokenizer-2k
      - KRONOS_ALLOW_ANALYTICAL_FALLBACK=${KRONOS_ALLOW_ANALYTICAL_FALLBACK:-false}
    volumes:
      - kronos-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - trading-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
networks:
  trading-net:
    external: true
volumes:
  app-data:
  app-logs:
  grafana-storage:
  kronos-model-cache:
  influxdb-2-ksyg_influxdb2-data:
    external: true
  influxdb-2-ksyg_influxdb2-config:
    external: true
