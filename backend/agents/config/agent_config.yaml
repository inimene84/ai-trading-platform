# Agent Configuration for Opinion Layer
# =====================================
# Controls weights, thresholds, and active agents for the trading opinion pipeline.

# Base agent weights (non-persona technical agents)
base_agents:
  technical_analyst: 0.25
  kronos_foundation: 0.20
  social_sentiment: 0.20
  market_alerts: 0.05
  macro_sentiment: 0.10   # global Fear & Greed (InfluxDB / n8n)
  news_archive: 0.12      # crypto-news vector archive (Qdrant / n8n)
  semantic_trade_memory: 0.08
  learned_skill: 0.08
  trade_memory: 0.04
  jev_analyst: 0.16          # TypeSafe Jev typed-eval; inert until JEV_ANALYSIS_ENABLED

# Active personas (can be toggled without code changes)
# Override with ACTIVE_PERSONAS env var (comma-separated)
active_personas:
  - warren_buffett
  - michael_burry
  - stanley_druckenmiller
  - cathie_wood
  - peter_lynch
  - charlie_munger
  - nassim_taleb
  - bill_ackman
  - phil_fisher
  - aswath_damodaran
  - mohnish_pabrai
  - rakesh_jhunjhunwala

# Direction thresholds for opinion aggregation
aggregation:
  buy_threshold: 0.15
  sell_threshold: -0.15
  confidence_score_weight: 0.6
  confidence_conviction_weight: 0.4
