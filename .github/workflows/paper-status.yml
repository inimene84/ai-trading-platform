name: Paper status

# Read-only. Does not rebuild, restart, or change TRADING_MODE.
on:
  workflow_dispatch:

concurrency:
  group: vps-paper-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Read paper loop status
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH_PRIVATE_KEY is not available to this workflow."
            exit 1
          fi
          host="${SSH_HOST:-72.60.18.113}"
          user="${SSH_USER:-root}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${user}@${host}" 'bash -s' << 'REMOTE'
          set -euo pipefail
          cd /root/ai-trading-platform-v3
          echo "git $(git rev-parse --short HEAD)"
          docker inspect -f '{{.State.Status}} {{.State.StartedAt}}' ai-trading-backend
          python3 - << 'PY'
          import json
          import urllib.request
          from pathlib import Path

          env = {}
          for line in Path(".env").read_text(encoding="utf-8").splitlines():
              if not line or line.lstrip().startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          admin = env.get("ADMIN_API_KEY", "")

          def call(path):
              request = urllib.request.Request(
                  "http://127.0.0.1:8001" + path,
                  headers={"X-API-Key": admin},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          health = call("/health")
          status = call("/trading/status")
          loop = call("/trading/loop/status")
          print("mode", status.get("mode"), "dry_run", status.get("dry_run"), "broker", status.get("active_broker"))
          print("trading_allowed", health.get("trading_allowed"), "trading_status", health.get("trading_status"))
          print(
              "loop_running", loop.get("running"),
              "state", loop.get("state"),
              "cycles", loop.get("cycle_count"),
              "symbols", len(loop.get("symbols") or []),
              "strategy", loop.get("strategy"),
              "interval_minutes", loop.get("interval_minutes"),
          )
          print("cash", loop.get("cash"), "equity", loop.get("equity"), "margin_used", loop.get("margin_used"))
          print("last_cycle", loop.get("last_cycle"))
          print("next_cycle", loop.get("next_cycle"))
          print("error", loop.get("error"))

          def safe(path):
              try:
                  return call(path)
              except Exception as exc:
                  print("endpoint_error", path, type(exc).__name__)
                  return None

          book = safe("/trading/paper/portfolio")
          positions = safe("/trading/paper/positions")
          stats = safe("/trading/paper/stats")
          if isinstance(book, dict):
              pf = book.get("portfolio") or {}
              print(
                  "paper_book",
                  "cash", pf.get("cash"),
                  "equity", pf.get("equity"),
                  "margin", pf.get("margin_used"),
                  "orders", pf.get("order_count"),
                  "fills", pf.get("trade_count"),
                  "symbols", sorted((pf.get("positions") or {}).keys()),
              )
              for sym, pos in sorted((pf.get("positions") or {}).items()):
                  long_qty = float(pos.get("long") or 0)
                  short_qty = float(pos.get("short") or 0)
                  if long_qty or short_qty:
                      print(
                          "paper_pos", sym,
                          "long", long_qty, "long_avg", pos.get("long_cost_basis"),
                          "short", short_qty, "short_avg", pos.get("short_cost_basis"),
                      )
          if isinstance(stats, dict):
              print(
                  "paper_stats",
                  "trades", stats.get("total_trades"),
                  "pnl", stats.get("total_pnl"),
                  "fees", stats.get("total_fees"),
                  "wins", stats.get("winning_trades"),
                  "losses", stats.get("losing_trades"),
              )
          if isinstance(positions, dict):
              print("paper_position_rows", positions.get("count"))
              for row in positions.get("positions") or []:
                  print(
                      "paper_row", row.get("symbol"), row.get("side"),
                      "qty", row.get("quantity"), "avg", row.get("avg_price"),
                  )
          PY
          docker exec -i ai-trading-backend python - << 'PY'
          from sqlalchemy import func
          from backend.database.connection import SessionLocal
          from backend.database.models import Trade, PaperTrade, PaperPortfolio

          db = SessionLocal()
          try:
              books = db.query(PaperPortfolio).all()
              print("db_paper_books", len(books))
              for book in books:
                  print(
                      "db_book", book.portfolio_id, book.broker,
                      "cash", round(float(book.cash or 0), 4),
                      "initial", round(float(book.initial_balance or 0), 4),
                      "margin", round(float(book.margin_used or 0), 4),
                  )
              fills = db.query(func.count(PaperTrade.id), func.coalesce(func.sum(PaperTrade.pnl), 0), func.coalesce(func.sum(PaperTrade.fee), 0)).one()
              print("db_paper_fills", int(fills[0]), "realized_pnl", round(float(fills[1]), 4), "fees", round(float(fills[2]), 4))
              open_rows = (
                  db.query(Trade)
                  .filter(Trade.status.in_(["open", "filled"]))
                  .order_by(Trade.id.asc())
                  .all()
              )
              print("db_open_trades", len(open_rows))
              nonzero = 0
              total = 0.0
              for row in open_rows:
                  pnl = float(row.pnl or 0)
                  total += pnl
                  if abs(pnl) > 1e-9:
                      nonzero += 1
                  print(
                      "open", row.id, row.symbol, row.direction,
                      "qty", row.quantity, "entry", row.entry_price,
                      "stored_pnl", pnl, "mode", row.mode, "broker", row.broker, "status", row.status,
                  )
              closed = (
                  db.query(func.count(Trade.id), func.coalesce(func.sum(Trade.pnl), 0))
                  .filter(Trade.status == "closed", Trade.mode == "paper")
                  .one()
              )
              print("open_stored_pnl_sum", round(total, 4), "open_nonzero", nonzero)
              print("closed_paper_trades", int(closed[0]), "closed_paper_pnl", round(float(closed[1]), 4))
          finally:
              db.close()
          PY
          REMOTE
