name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docs/ml/qtp-promotion-contract/**"
      - "jesse_quant/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/ml/qtp-promotion-contract/**"
      - "jesse_quant/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (mirror production)
        # Production builds from backend/requirements.txt (see Dockerfile.backend).
        # CI uses the SAME file so a green run reflects production behavior.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: |
          ruff check backend

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest backend/tests
