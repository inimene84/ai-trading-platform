services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-trading-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      OLLAMA_BASE_URL: http://litellm:4000
      TRADING_MODE: ${TRADING_MODE:-paper}
      ACTIVE_BROKER: ${ACTIVE_BROKER:-ctrader}
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-true}
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      KIE_API_KEY: ${KIE_API_KEY}
      KIE_MODEL: ${KIE_MODEL:-gpt-5-6-luna}
      KIE_FALLBACK_MODELS: ${KIE_FALLBACK_MODELS:-gemini-3-8-flash-openai,claude-haiku-4-5}
      KIE_OPUS_MODEL: ${KIE_OPUS_MODEL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      # PRIMARY LLM: OmniRoute auto-router (Kie is a fallback in backend.llm.router)
      PERSONA_LLM_PROVIDER: ${PERSONA_LLM_PROVIDER:-omniroute}
      PERSONA_LLM_MODEL: ${PERSONA_LLM_MODEL:-auto/fast}
      OMNIROUTE_DEFAULT_MODEL: ${OMNIROUTE_DEFAULT_MODEL:-auto/fast}
      PERSONA_LLM_BASE_URL: ${PERSONA_LLM_BASE_URL:-https://omni.allikas.online/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-https://omni.allikas.online/v1}
      # Safety: risk guard ENABLED by default. Only disable for explicit testing by setting DISABLE_RISK_GUARD=true in .env
      DISABLE_RISK_GUARD: ${DISABLE_RISK_GUARD:-false}
      # Jev via OpenRouter is advisory. It journals analysis and cannot size or vote
      # until calibration reaches FACE_VALUE and JEV_INFLUENCE_BOOK is turned on.
      JEV_ANALYSIS_ENABLED: ${JEV_ANALYSIS_ENABLED:-true}
      JEV_REPLACE_PERSONAS: ${JEV_REPLACE_PERSONAS:-false}
      JEV_INCLUDE_SOCIAL: ${JEV_INCLUDE_SOCIAL:-false}
      JEV_INFLUENCE_BOOK: ${JEV_INFLUENCE_BOOK:-false}
      JEV_PROVIDER: ${JEV_PROVIDER:-openrouter}
      JEV_OPENROUTER_MODEL: ${JEV_OPENROUTER_MODEL:-typesafe/jev-1.13}
      JEV_RESEARCH_CLASSIFY: ${JEV_RESEARCH_CLASSIFY:-false}
      # MiCA/EEA: trade USDC-margined perpetuals (USDT restricted for EU users).
      # Override via TRADING_SYMBOLS in .env. ADA dropped (weekly loss leader).
      TRADING_SYMBOLS: ${TRADING_SYMBOLS:-BTCUSDC,ETHUSDC,SOLUSDC,BNBUSDC,XRPUSDC,AVAXUSDC,LINKUSDC,UNIUSDC}
      KRONOS_SIDECAR_URL: ${KRONOS_SIDECAR_URL:-http://kronos-infer:8001}
      SCRAPLING_RESEARCH_URL: ${SCRAPLING_RESEARCH_URL:-http://ai-trading-scrapling:8080}
      TIMING_GATE_SHADOW: ${TIMING_GATE_SHADOW:-false}
      ENABLE_VISION_TIMING: ${ENABLE_VISION_TIMING:-false}
      KRONOS_ALLOW_LOCAL_STUB: ${KRONOS_ALLOW_LOCAL_STUB:-false}
      # Liquidity floor. 3M keeps USDC majors (USDC books are thinner than
      # USDT twins; 50M would silently drop AVAX/LINK/UNI). Override in .env.
      MIN_24H_QUOTE_VOLUME_USDT: ${MIN_24H_QUOTE_VOLUME_USDT:-3000000}
      # Payoff geometry. TRAIL_ATR_MULT MUST be < TRAIL_ACTIVATION_ATR.
      SL_ATR_MULT: ${SL_ATR_MULT:-1.75}
      TP_ATR_MULT: ${TP_ATR_MULT:-5.5}
      ATR_PERIOD: ${ATR_PERIOD:-14}
      TRAIL_ACTIVATION_ATR: ${TRAIL_ACTIVATION_ATR:-2.0}
      TRAIL_ATR_MULT: ${TRAIL_ATR_MULT:-0.8}
      STEP_TRAIL_ENABLED: ${STEP_TRAIL_ENABLED:-false}
      RISK_MAX_DRAWDOWN_PCT: ${RISK_MAX_DRAWDOWN_PCT:-20}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-5}
      RISK_PEAK_LOOKBACK_HOURS: ${RISK_PEAK_LOOKBACK_HOURS:-72}
      PYRAMID_MAX_LAYERS: ${PYRAMID_MAX_LAYERS:-2}
      PYRAMID_BLOCK_UNDERWATER: ${PYRAMID_BLOCK_UNDERWATER:-true}
      MAX_SAME_DIRECTION_POSITIONS: ${MAX_SAME_DIRECTION_POSITIONS:-8}
      # Fee-churn fix: post-only (GTX) maker entries with MARKET fallback.
      # OFF by default (fail-safe). Set true to cut entry fees 0.05%->0.02%.
      MAKER_ENTRY_ENABLED: ${MAKER_ENTRY_ENABLED:-true}
      MAKER_WAIT_SEC: ${MAKER_WAIT_SEC:-8}
    command:
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: 1.5
          memory: 6G
        reservations:
          cpus: 0.5
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ./.env:/app/.env
      - ./backend:/app/backend
      - ./scrapling_sidecar:/app/scrapling_sidecar
    networks:
      - trading-net
  litellm:
    # Pin digest (was main-latest) for reproducible deploys.
    image: ghcr.io/berriai/litellm@sha256:2fdd90b14e3d9244ce297f418b983d8cfd90ba6e72a10a8ddb30f7cf64852390
    container_name: ai-trading-litellm
    environment:
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      KIE_API_KEY: ${KIE_API_KEY}
      KIE_BEARER_TOKEN: "Bearer ${KIE_API_KEY}"
      KIE_MODEL: ${KIE_MODEL:-gpt-5-6-luna}
      KIE_FALLBACK_MODELS: ${KIE_FALLBACK_MODELS:-gemini-3-8-flash-openai,claude-haiku-4-5}
      KIE_OPUS_MODEL: ${KIE_OPUS_MODEL:-}
      LITELLM_MODEL_FALLBACK: true
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set}
    command: --config /tmp/litellm-config.yaml --port 4000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:4000"
    volumes:
      - ./litellm-config.yaml:/tmp/litellm-config.yaml:ro
    networks:
      - trading-net
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: vps-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # local diagnostics; backend uses Docker network
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - ./qdrant-storage:/qdrant/storage
    networks:
      - trading-net
  influxdb:
    image: influxdb:2.7
    container_name: vps-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:?INFLUXDB_ADMIN_PASSWORD must be set}
      - DOCKER_INFLUXDB_INIT_ORG=hedge-fund
      - DOCKER_INFLUXDB_INIT_BUCKET=news-sentiment
      - DOCKER_INFLUXDB_INIT_RETENTION=7d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-local-dev-token}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-storage:/var/lib/influxdb2
    networks:
      - trading-net
      - n8n_default
  nginx:
    image: nginx:alpine
    container_name: ai-trading-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - trading-net
  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: ai-trading-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    env_file:
      - .env
    environment:
      - BACKEND_BASE_URL=http://ai-trading-backend:8000
      - BACKEND_API_PREFIX=/api
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9100
      - MCP_API_TOKEN=${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      - SCRAPLING_RESEARCH_URL=http://ai-trading-scrapling:8080
    networks:
      - trading-net
    depends_on:
      - backend
  scrapling:
    image: pyd4vinci/scrapling:latest
    container_name: ai-trading-scrapling
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/scrapling-sidecar/entrypoint.sh"]
    ports:
      - "127.0.0.1:8003:8000"
      - "127.0.0.1:8004:8080"
    env_file:
      - .env
    environment:
      SCRAPLING_MCP_AUTH_TOKEN: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      BACKEND_BASE_URL: http://ai-trading-backend:8000
      BACKEND_API_PREFIX: /api
      SCRAPLING_INGEST_ENABLED: ${SCRAPLING_INGEST_ENABLED:-false}
      SCRAPLING_INGEST_INTERVAL_SEC: ${SCRAPLING_INGEST_INTERVAL_SEC:-3600}
      JBLANKED_API_KEY: ${JBLANKED_API_KEY:-}
      CALENDAR_JSON_URL: ${CALENDAR_JSON_URL:-}
      NEWS_RSS_URLS: ${NEWS_RSS_URLS:-https://www.federalreserve.gov/feeds/press_all.xml}
    volumes:
      - ./scrapling_sidecar:/opt/scrapling-sidecar:ro
    networks:
      - trading-net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
  kronos-infer:
    build:
      context: ./kronos-infer
      dockerfile: Dockerfile
    container_name: ai-trading-kronos
    restart: unless-stopped
    # Host 8001 is already used by backend API — publish Kronos on 8002.
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      - KRONOS_MODEL=NeoQuasar/Kronos-mini
      - KRONOS_TOKENIZER=NeoQuasar/Kronos-Tokenizer-2k
      - KRONOS_ALLOW_ANALYTICAL_FALLBACK=${KRONOS_ALLOW_ANALYTICAL_FALLBACK:-false}
    volumes:
      - kronos-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - trading-net
  ai-memory:
    # Local MCP memory server from C:\Users\thori\ai-memory-main.
    # Published image for a fast start. To run the checkout instead:
    #   image: ai-memory:local
    #   build:
    #     context: ../../ai-memory-main
    #     dockerfile: docker/Dockerfile
    image: akitaonrails/ai-memory:latest
    container_name: ai-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:49374:49374"
    volumes:
      - ai-memory-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: ai_memory=info,ai_memory_store=info,ai_memory_wiki=info,ai_memory_mcp=info,tracing_appender=warn
      # Zero-LLM by default (FTS5 search still works). To enable consolidation
      # through this stack's LiteLLM, add these to .env:
      #   AI_MEMORY_LLM_PROVIDER=openai-compat
      #   AI_MEMORY_LLM_BASE_URL=http://litellm:4000/v1
      #   LLM_API_KEY=<same as LITELLM_API_KEY / sk-local-litellm-key>
    healthcheck:
      test: ["CMD", "/usr/local/bin/ai-memory", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - trading-net
networks:

  trading-net:
    external: true
  n8n_default:
    external: true
volumes:
  app-data:
  app-logs:
  influxdb-storage:
  kronos-model-cache:
  ai-memory-data:
    name: ai-memory-data
