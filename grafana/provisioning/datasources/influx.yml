apiVersion: 1

# Provisioned read-only via docker-compose.prod.yml.
# Token/org come from the Grafana container environment (VPS .env).
datasources:
  - name: influxdb
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://vps-influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: trading-system
      httpMode: POST
    secureJsonData:
      token: $INFLUXDB_TOKEN

  - name: influxdb - system
