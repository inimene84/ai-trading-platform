apiVersion: 1

datasources:
  - name: influxdb
    type: influxdb
    access: proxy
    # Compose service name on trading-net (container vps-influxdb)
    url: http://influxdb:8086
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: hedge-fund
      defaultBucket: trading-system
      tlsSkipVerify: true
    secureJsonData:
      # Expanded from the grafana container environment (project .env)
      token: $INFLUXDB_TOKEN
